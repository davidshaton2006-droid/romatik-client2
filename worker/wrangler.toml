name = "romantik-baza-payments"
main = "src/index.ts"
compatibility_date = "2025-01-01"

[vars]
FIREBASE_PROJECT_ID = "romantik-client"
FIREBASE_DATABASE_ID = "(default)"
ALLOWED_ORIGINS = "https://romantik-baza.ru,http://romantik-baza.ru,https://www.romantik-baza.ru"
TRAVELLINE_PROPERTY_ID = "68306"
# How many nights ahead to check real TravelLine availability/quota each
# sync run (see travellineAvailability.ts) — one API call per night.
TRAVELLINE_AVAILABILITY_DAYS_AHEAD = "21"

# Backup for the TravelLine webhook — periodically pulls new/changed
# bookings even if a webhook is missed or never configured.
#
# NOTE: the hourly "0 * * * *" trigger for the availability/quota check
# (travellineAvailability.ts) has been deliberately REMOVED for now. Its
# first real run showed the TravelLine Search API reporting 0 availability
# for nights that were actually free (confirmed against the TravelLine
# calendar), because that endpoint reflects guest-facing sale rules (rate
# plans, minimum stay, sale horizon) — not raw physical room quota. It wrote
# ~350 incorrect "sold out" placeholder bookings before this was caught and
# rolled back. Do not re-add this cron (or call the endpoint below other
# than for one-off testing) until the logic is reworked to use TravelLine's
# actual inventory/quota data source instead of the Search API.
[triggers]
crons = ["*/15 * * * *"]

# Secrets — set these with `wrangler secret put <NAME>`, never commit them:
#   YOOKASSA_SHOP_ID
#   YOOKASSA_SECRET_KEY
#   FIREBASE_SERVICE_ACCOUNT_JSON   (paste the full service account JSON key as one line)
#   TRAVELLINE_CLIENT_ID
#   TRAVELLINE_CLIENT_SECRET
#   TRAVELLINE_WEBHOOK_KEY          (shared secret TravelLine sends back in X-Webhook-Key)
#   TELEGRAM_BOT_TOKEN              (same bot as the staff app, so notifications land in the same chat)
#   TELEGRAM_CHAT_ID
